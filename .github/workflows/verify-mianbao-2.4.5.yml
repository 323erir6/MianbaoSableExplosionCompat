name: Verify Mianbao 2.4.5

on:
  push:
    branches:
      - port-mianbao-2.4.5
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Download Sable 2.0.5 and Mianbao 2.4.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../_deps_sable_2_0_5 ../_deps_sable/META-INF/jarjar .ci-deps

          curl -fL --retry 3 \
            "https://mediafilez.forgecdn.net/files/8673/825/sable-neoforge-1.21.1-2.0.5.jar" \
            -o ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar
          curl -fL --retry 3 \
            "https://cursemaven.com/curse/maven/mianbaos-newmodernwarfare-1619723/8684048/mianbaos-newmodernwarfare-1619723-8684048.jar" \
            -o .ci-deps/mianbaos_modernwarfare-2.4.5-neoforge.jar

          unzip -t ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar >/dev/null
          unzip -t .ci-deps/mianbaos_modernwarfare-2.4.5-neoforge.jar >/dev/null

          COMPANION_PATH="$(unzip -Z1 ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar | grep -E 'META-INF/jarjar/sable-companion-common-.*\.jar$' | head -n 1)"
          test -n "$COMPANION_PATH"
          unzip -p ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar "$COMPANION_PATH" \
            > ../_deps_sable/META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar

          unzip -t ../_deps_sable/META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar >/dev/null

      - name: Build and verify hooks against Mianbao 2.4.5
        run: gradle --no-daemon clean build -PmianbaoJar="$PWD/.ci-deps/mianbaos_modernwarfare-2.4.5-neoforge.jar"

      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mianbao-sable-explosion-compat-1.0.1
          path: build/libs/mianbao-sable-explosion-compat-1.0.1.jar
          if-no-files-found: error
