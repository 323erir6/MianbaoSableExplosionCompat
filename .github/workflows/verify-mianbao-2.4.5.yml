name: Verify Mianbao 2.4.5

on:
  push:
    branches:
      - port-mianbao-2.4.5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Download Sable 2.0.5 and Mianbao 2.4.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../_deps_sable_2_0_5 ../_deps_sable/META-INF/jarjar .ci-deps

          python3 <<'PY'
          import re
          import urllib.request

          target = "mianbaos_modernwarfare-2.4.5-neoforge.jar"
          base = "https://www.curseforge.com/minecraft/mc-mods/mianbaos-newmodernwarfare"
          request = urllib.request.Request(
              base + "/files/all?page=1&pageSize=50&showAlphaFiles=hide&sortBy=dateCreated&sortOrder=desc",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          html = urllib.request.urlopen(request, timeout=30).read().decode("utf-8", "replace")
          if target not in html:
              raise SystemExit("Could not find Mianbao 2.4.5 on the CurseForge files page")

          pos = html.index(target)
          window = html[max(0, pos - 20000):pos + 20000]
          candidates = []
          for value in re.findall(r"(?:files/|fileId[^0-9]{0,20})(\d{6,9})", window):
              if value not in candidates:
                  candidates.append(value)

          found = None
          for file_id in candidates:
              url = f"{base}/files/{file_id}"
              try:
                  detail = urllib.request.urlopen(
                      urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=20
                  ).read().decode("utf-8", "replace")
              except Exception:
                  continue
              if target in detail:
                  found = file_id
                  break

          if found is None:
              # Fallback for page layouts where the file id is serialized next to the filename.
              patterns = [
                  rf'"id"\s*:\s*(\d+)[^{{}}]{{0,4000}}{re.escape(target)}',
                  rf'{re.escape(target)}[^{{}}]{{0,4000}}"id"\s*:\s*(\d+)',
              ]
              for pattern in patterns:
                  match = re.search(pattern, html)
                  if match:
                      found = match.group(1)
                      break

          if found is None:
              raise SystemExit("Could not resolve the CurseForge file ID for Mianbao 2.4.5")

          print("Resolved Mianbao 2.4.5 CurseForge file ID:", found)
          with open(".ci-deps/mianbao-file-id.txt", "w", encoding="utf-8") as f:
              f.write(found)
          PY

          MIANBAO_FILE_ID="$(cat .ci-deps/mianbao-file-id.txt)"
          curl -fL --retry 3 -A "Mozilla/5.0" \
            "https://www.curseforge.com/minecraft/mc-mods/sable/download/8673825/file" \
            -o ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar
          curl -fL --retry 3 -A "Mozilla/5.0" \
            "https://www.curseforge.com/minecraft/mc-mods/mianbaos-newmodernwarfare/download/${MIANBAO_FILE_ID}/file" \
            -o .ci-deps/mianbaos_modernwarfare-2.4.5-neoforge.jar

          COMPANION_PATH="$(unzip -Z1 ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar | grep -E 'META-INF/jarjar/sable-companion-common-.*\.jar$' | head -n 1)"
          test -n "$COMPANION_PATH"
          unzip -p ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar "$COMPANION_PATH" \
            > ../_deps_sable/META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar

          test -s ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar
          test -s ../_deps_sable/META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar
          test -s .ci-deps/mianbaos_modernwarfare-2.4.5-neoforge.jar

      - name: Build and verify hooks against Mianbao 2.4.5
        run: gradle --no-daemon clean build -PmianbaoJar="$PWD/.ci-deps/mianbaos_modernwarfare-2.4.5-neoforge.jar"

      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mianbao-sable-explosion-compat-1.0.1
          path: build/libs/mianbao-sable-explosion-compat-1.0.1.jar
          if-no-files-found: error
